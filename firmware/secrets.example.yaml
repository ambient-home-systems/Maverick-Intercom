# Copy to secrets.yaml, then fill values locally. Never commit secrets.yaml.
# Reuse each device's existing ESPHome API encryption key and OTA password.
wifi_ssid: "your-wifi"
wifi_password: "your-wifi-password"
api_encryption_key: "your-existing-api-encryption-key"
api_encryption_key_b: "device-B-existing-api-encryption-key"
ota_password: "your-existing-ota-password"
ota_password_b: "device-B-existing-ota-password"
intercom_host: "intercom.home.example"
intercom_token: "device-A-token-from-local-relay-json"
intercom_token_b: "device-B-token-from-local-relay-json"
