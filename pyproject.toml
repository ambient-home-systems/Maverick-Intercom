[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maverick-intercom"
version = "0.1.0"
description = "Experimental local audio relay for ESPHome intercom endpoints"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
maverick-relay = "maverick_intercom.relay:main"

[tool.setuptools.packages.find]
where = ["src"]
